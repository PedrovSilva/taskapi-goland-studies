name: CI

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskapi

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d taskapi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/taskapi?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Prepare database
        run: |
          PGPASSWORD=postgres psql \
            --host=localhost \
            --port=5432 \
            --username=postgres \
            --dbname=taskapi \
            --file=db/migrations/001_create_tasks.sql

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Run tests
        run: |
          go test ./... -count=1

      - name: Run vet
        run: |
          go vet ./...