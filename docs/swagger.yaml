basePath: /api/v1
definitions:
  domain.Status:
    enum:
    - pending
    - in_progress
    - done
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusInProgress
    - StatusDone
  domain.Task:
    properties:
      created_at:
        type: string
      description:
        type: string
      done_at:
        type: string
      id:
        type: string
      status:
        $ref: '#/definitions/domain.Status'
      title:
        type: string
      updated_at:
        type: string
    type: object
  handler.errorResponse:
    properties:
      error:
        type: string
    type: object
  service.CreateInput:
    properties:
      description:
        type: string
      title:
        type: string
    type: object
  service.UpdateInput:
    properties:
      description:
        type: string
      status:
        $ref: '#/definitions/domain.Status'
      title:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: Pedro Vítor da Cruz Silva
    url: https://github.com/pedrovsilva/taskapi
  description: REST API for task management built in Go, PostgreSQL and Docker.
  title: Task API
  version: "1.0"
paths:
  /tasks:
    get:
      description: Returns all tasks ordered by creation date
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Task'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: List all tasks
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: Creates a new task with pending status
      parameters:
      - description: Task input
        in: body
        name: task
        required: true
        schema:
          $ref: '#/definitions/service.CreateInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Task'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Create a task
      tags:
      - tasks
  /tasks/{id}:
    delete:
      description: Permanently removes a task by its UUID
      parameters:
      - description: Task UUID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Delete a task
      tags:
      - tasks
    get:
      description: Returns a single task by its UUID
      parameters:
      - description: Task UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Task'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Get task by ID
      tags:
      - tasks
    patch:
      consumes:
      - application/json
      description: Partially updates a task's title, description or status
      parameters:
      - description: Task UUID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: task
        required: true
        schema:
          $ref: '#/definitions/service.UpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Task'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Update a task
      tags:
      - tasks
schemes:
- http
swagger: "2.0"
