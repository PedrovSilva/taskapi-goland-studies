services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/taskapi?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/taskapi?sslmode=disable
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskapi
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations/001_create_tasks.sql:/docker-entrypoint-initdb.d/001_create_tasks.sql

volumes:
  pgdata:
